name: Android Debug APK

# Ne zaman calissin: main'e her push'ta + istersen elle "Run workflow" ile.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Debug APK derle
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.2

    env:
      GODOT_VERSION: "4.5.2"
      EXPORT_PRESET: "Android Debug"
      APK_NAME: "kucuk-dunya-debug.apk"
      DIAG_LOG: "/tmp/export.log"

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      # Imaj, export template'lerini /root altinda tutuyor. Runner kullanicisi
      # root olmadigi icin bunlari kendi ev dizinine tasiyoruz.
      - name: Godot export template'lerini hazirla
        run: |
          set -x
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ] && [ ! -d ~/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/godot
          fi
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$SRC" ]; then
            cp -a "$SRC" ~/.local/share/godot/export_templates/
          fi
          {
            echo "===== [SETUP] godot --version ====="
            godot --version 2>&1 | tail -1
            echo "===== [SETUP] export templates ====="
            ls -1 ~/.local/share/godot/export_templates/*/ 2>/dev/null | head -40
            echo "===== [SETUP] editor settings ====="
            cat ~/.config/godot/editor_settings-*.tres 2>/dev/null
            echo "===== [SETUP] android sdk ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-yok}"
            ls -1 "${ANDROID_HOME:-/usr/lib/android-sdk}" 2>/dev/null
            ls -1 "${ANDROID_HOME:-/usr/lib/android-sdk}"/build-tools 2>/dev/null
            java -version 2>&1
          } >> "${DIAG_LOG}" 2>&1
          grep -v fontconfig "${DIAG_LOG}" | tail -40

      # Ilk acilista Godot import eder (.godot klasoru olusur). Bu adim olmadan
      # export bazen bos/kirik pck uretir, o yuzden acikca yapiyoruz.
      - name: Projeyi ice aktar
        run: |
          {
            echo "===== [IMPORT] ====="
            godot --headless --editor --quit --path . 2>&1
          } >> "${DIAG_LOG}" 2>&1
          grep -vE "fontconfig|get_system_font_path" "${DIAG_LOG}" | tail -15

      - name: Debug APK export et
        id: export
        run: |
          mkdir -p build/android
          APK_PATH="$(readlink -f build/android)/${APK_NAME}"
          echo "APK hedefi: ${APK_PATH}"
          {
            echo "===== [EXPORT] ${EXPORT_PRESET} -> ${APK_PATH} ====="
          } >> "${DIAG_LOG}"
          set +e
          godot --headless --verbose --export-debug "${EXPORT_PRESET}" "${APK_PATH}" --path . >> "${DIAG_LOG}" 2>&1
          CODE=$?
          set -e
          echo "GODOT_EXIT=${CODE}"
          echo "===== [EXPORT] cikti (son 80 satir) ====="
          grep -vE "fontconfig|get_system_font_path" "${DIAG_LOG}" | tail -80
          if [ "${CODE}" -ne 0 ]; then
            echo "::error::Godot export ${CODE} koduyla basarisiz oldu"
            exit "${CODE}"
          fi

      - name: APK gercekten olustu mu kontrol et
        run: |
          ls -lh build/android/
          test -s "build/android/$APK_NAME" || { echo "::error::APK olusmadi"; exit 1; }

      - name: APK'yi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: kucuk-dunya-debug-apk
          path: build/android/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      # Log indirme servisi bazi ortamlardan erisilemedigi icin, tanilama
      # logunu her durumda bir dala yaziyoruz.
      - name: Tanilama logunu yaz
        if: always()
        run: |
          set -x
          grep -vE "fontconfig|get_system_font_path" "${DIAG_LOG}" > /tmp/export_clean.log || true
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q
          git config user.name "ci-diagnostics"
          git config user.email "ci@localhost"
          cp /tmp/export_clean.log ./export.log
          ls -la build 2>/dev/null || true
          git checkout -q -b ci-logs
          git add export.log
          git commit -q -m "CI tanilama logu: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
