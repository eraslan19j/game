name: Android Debug APK

# Ne zaman calissin: main'e her push'ta + istersen elle "Run workflow" ile.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release olusturup APK yukleyebilmek icin gerekli.
permissions:
  contents: write

# Ayni anda iki release calismasi cakismasin.
concurrency:
  group: android-debug-release
  cancel-in-progress: false

jobs:
  build-apk:
    name: Debug APK derle
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.2

    env:
      GODOT_VERSION: "4.5.2"
      EXPORT_PRESET: "Android Debug"
      APK_NAME: "kucuk-dunya-debug.apk"
      DIAG_LOG: "/tmp/export.log"

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      # Imaj, export template'lerini /root altinda tutuyor. Runner kullanicisi
      # root olmadigi icin bunlari kendi ev dizinine tasiyoruz.
      - name: Godot export template'lerini hazirla
        run: |
          set -x
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ] && [ ! -d ~/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/godot
          fi
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$SRC" ]; then
            cp -a "$SRC" ~/.local/share/godot/export_templates/
          fi
          {
            echo "===== [SETUP] godot --version ====="
            godot --version 2>&1 | tail -1
            echo "===== [SETUP] export templates ====="
            ls -1 ~/.local/share/godot/export_templates/*/ 2>/dev/null | head -40
            echo "===== [SETUP] editor settings ====="
            cat ~/.config/godot/editor_settings-*.tres 2>/dev/null
            echo "===== [SETUP] android sdk ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-yok}"
            ls -1 "${ANDROID_HOME:-/usr/lib/android-sdk}" 2>/dev/null
            java -version 2>&1
          } >> "${DIAG_LOG}" 2>&1
          grep -v fontconfig "${DIAG_LOG}" | tail -20

      # Ilk acilista Godot import eder (.godot klasoru olusur). Bu adim olmadan
      # export bazen bos/kirik pck uretir, o yuzden acikca yapiyoruz.
      - name: Projeyi ice aktar
        run: |
          {
            echo "===== [IMPORT] ====="
            godot --headless --editor --quit --path . 2>&1
          } >> "${DIAG_LOG}" 2>&1
          grep -vE "fontconfig|get_system_font_path" "${DIAG_LOG}" | tail -10

      - name: Debug APK export et
        run: |
          mkdir -p build/android
          APK_PATH="$(readlink -f build/android)/${APK_NAME}"
          {
            echo "===== [EXPORT] ${EXPORT_PRESET} -> ${APK_PATH} ====="
          } >> "${DIAG_LOG}"
          set +e
          godot --headless --verbose --export-debug "${EXPORT_PRESET}" "${APK_PATH}" --path . >> "${DIAG_LOG}" 2>&1
          CODE=$?
          set -e
          echo "GODOT_EXIT=${CODE}"
          grep -vE "fontconfig|get_system_font_path" "${DIAG_LOG}" | tail -40
          if [ "${CODE}" -ne 0 ]; then
            echo "::error::Godot export ${CODE} koduyla basarisiz oldu"
            exit "${CODE}"
          fi

      - name: APK gercekten olustu mu kontrol et
        run: |
          ls -lh build/android/
          test -s "build/android/$APK_NAME" || { echo "::error::APK olusmadi"; exit 1; }

      - name: APK icerigini dogrula
        run: |
          {
            echo "===== [INSPECT] yerel kutuphaneler ====="
            unzip -l "build/android/$APK_NAME" | grep -oE 'lib/[a-z0-9_]+/[a-z0-9_.]+\.so' | sort -u
            echo "===== [INSPECT] manifest ====="
            AAPT=$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | tail -1)
            "${AAPT}" dump badging "build/android/$APK_NAME" 2>&1 | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:|^native-code" | head -8
            echo "===== [INSPECT] boyut ====="
            stat -c '%s bytes' "build/android/$APK_NAME"
          } >> "${DIAG_LOG}" 2>&1
          sed -n '/\[INSPECT\]/,$p' "${DIAG_LOG}" | tail -20

      - name: APK'yi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: kucuk-dunya-debug-apk
          path: build/android/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------
      # "latest" Release'ini olustur/guncelle ve APK'yi oraya koy.
      # Sabit link: /releases/latest/download/kucuk-dunya-debug.apk
      # ---------------------------------------------------------------
      # -----------------------------------------------------------------
      # "latest" etiketli Release'i olustur/guncelle ve APK'yi oraya koy.
      # Sabit link: /releases/latest/download/kucuk-dunya-debug.apk
      # Not: imajda "gh" CLI yok, bu yuzden softprops/action-gh-release kullaniliyor.
      # overwrite_files: true -> varsa eski APK'nin uzerine yazar (silme gerekmez).
      # -----------------------------------------------------------------
      - name: latest Release guncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "En son surum (latest)"
          body: |
            Her `main` push'unda otomatik derlenip buraya yuklenir.

            **Sabit indirme linki:**
            https://github.com/eraslan19j/game/releases/latest/download/kucuk-dunya-debug.apk

            APK: debug, arm64-v8a, yalnizca test icin.
          files: build/android/${{ env.APK_NAME }}
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # Release'in gercekten yayinda oldugunu ve APK'nin indirilebilir
      # oldugunu dogrula (private depoda bu adim uyarir).
      - name: Release yayinda mi dogrula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          HDR="Authorization: Bearer ${GH_TOKEN}"

          echo "===== [VERIFY] repo gorunurlugu ====="
          curl -sS -H "${HDR}" "${API}" -o /tmp/repo.json || echo "repo istegi basarisiz"
          tr ',' '\n' < /tmp/repo.json | grep -i '"visibility"' || echo "(visibility okunamadi)"

          echo "===== [VERIFY] latest release ====="
          curl -sS -H "${HDR}" "${API}/releases/tags/latest" -o /tmp/rel.json || echo "release istegi basarisiz"
          tr ',' '\n' < /tmp/rel.json | grep -iE '"tag_name"|"draft"|"prerelease"|kucuk-dunya-debug|"size"' || echo "(release okunamadi)"

          echo "===== [VERIFY] sabit link ====="
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/kucuk-dunya-debug.apk"
          echo "URL=${URL}"

          # GitHub, yeni yayinlanan release'in "latest" yonlendirmesini birkac
          # saniye gec hazirlayabiliyor; bu yuzden yeniden deniyoruz.
          CODE="000"
          for ATTEMPT in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "${URL}" || echo "000")
            echo "deneme ${ATTEMPT}: yonlendirme HTTP ${CODE}"
            if [ "${CODE}" = "302" ] || [ "${CODE}" = "200" ]; then
              break
            fi
            sleep 10
          done
          curl -sS -o /dev/null -D - "${URL}" | grep -iE "^location:" || true

          echo "===== [VERIFY] sabit linkten gercek indirme ====="
          rm -f /tmp/dl.apk
          DL_CODE=$(curl -sS -L -o /tmp/dl.apk -w "%{http_code}" "${URL}" || echo "000")
          DL_SIZE=$(stat -c '%s' /tmp/dl.apk 2>/dev/null || echo 0)
          echo "HTTP=${DL_CODE} boyut=${DL_SIZE} bayt"
          if [ "${DL_CODE}" = "200" ]; then
            echo "===== [VERIFY] indirilen dosya APK mi ====="
            unzip -l /tmp/dl.apk | grep -E "AndroidManifest.xml|classes.dex" | head -3 || true
            if [ "${DL_SIZE}" -gt 15000000 ]; then
              echo "SONUC: sabit link calisiyor, APK gercekten indirildi (${DL_SIZE} bayt)."
            else
              echo "::error::Indirilen dosya beklenenden kucuk (${DL_SIZE} bayt)"
              exit 1
            fi
          else
            echo "::error::Sabit link indirilemedi (HTTP ${DL_CODE})"
            exit 1
          fi
          } 2>&1 | tee -a "${DIAG_LOG}"

      # Log indirme servisi bazi ortamlardan erisilemedigi icin, derleme
      # basarisiz olursa tanilama logunu bir dala yaziyoruz.
      - name: Tanilama logunu yaz (sadece basarisizlikta)
        if: failure()
        run: |
          set -x
          grep -vE "fontconfig|get_system_font_path" "${DIAG_LOG}" > /tmp/export_clean.log || true
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q
          git config user.name "ci-diagnostics"
          git config user.email "ci@localhost"
          cp /tmp/export_clean.log ./export.log
          git checkout -q -b ci-logs
          git add export.log
          git commit -q -m "CI tanilama logu: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
